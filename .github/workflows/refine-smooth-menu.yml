name: Refine smooth menu

on:
  push:
    branches: [agent/smooth-menu-outline-unified-fade]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/smooth-menu-outline-unified-fade
          fetch-depth: 0
      - run: python .github/scripts/refine-smooth-menu.py
      - shell: bash
        run: |
          grep -q "if CurrentCursorId == CursorAnimationId then" Library.lua
          ! grep -q "FormaMenuScale" Library.lua
      - shell: bash
        run: |
          git config user.name "Fyntra-Development"
          git config user.email "129816818+Fyntra-Development@users.noreply.github.com"
          git add Library.lua
          if ! git diff --cached --quiet; then
            git commit -m "Refine rapid menu cursor handoff"
            git push origin HEAD:agent/smooth-menu-outline-unified-fade
          fi

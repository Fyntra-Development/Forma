name: Fix Marin overlay scale

on:
  push:
    branches: [agent/fix-marin-overlay-scale]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-marin-overlay-scale
          fetch-depth: 0
      - name: Patch Marin overlay metadata
        run: python .github/scripts/fix_marin_overlay.py
      - name: Verify image is untouched and metadata is corrected
        shell: bash
        run: |
          grep -A4 "\['Marin Kitagawa'\]" addons/ThemeManager.lua | grep -q "Size = UDim2.fromOffset(300, 300)"
          grep -A4 "\['Marin Kitagawa'\]" addons/ThemeManager.lua | grep -q "VisibleAnchor = Vector2.new(0.08, 0.64)"
          test "$(git rev-parse HEAD:assets/idfk/marin-kitagawa.png)" = "2c876204523f7971b95df57fb1779d47b61021a2"
      - name: Commit runtime fix
        shell: bash
        run: |
          git config user.name "Fyntra-Development"
          git config user.email "129816818+Fyntra-Development@users.noreply.github.com"
          git add addons/ThemeManager.lua
          if ! git diff --cached --quiet; then
            git commit -m "Fix Marin overlay scale and position"
            git push origin HEAD:agent/fix-marin-overlay-scale
          fi

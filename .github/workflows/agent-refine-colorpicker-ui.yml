name: Agent refine colorpicker mode UI

on:
  push:
    branches:
      - agent/refine-colorpicker-mode-ui

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply colorpicker UI refinement patch
        run: python3 .github/agent_refine_colorpicker_ui_patch.py

      - name: Validate feature surface
        shell: bash
        run: |
          grep -q "AddMovingAccentGradient(Highlight, 1.6)" Library.lua
          grep -q "AddMovingAccentGradient(TabIndicator, 1.6)" Library.lua
          grep -q "CreateEmbeddedSlider(SpeedSection" Library.lua
          grep -q "AllowOpenedFrameInteraction = true" Library.lua
          grep -q "local function StepAnimatedEditor" Library.lua
          grep -q "ModeTransitionDuration = 0.28" Library.lua
          grep -q "PreviewShade" Library.lua
          grep -q "UpdateModeLayout = function" Library.lua
          grep -q "if not Info.NoRegister then Options\[Idx\] = Slider" Library.lua

      - name: Build Luau compiler
        shell: bash
        run: |
          git clone --depth 1 https://github.com/luau-lang/luau.git /tmp/luau
          cmake -S /tmp/luau -B /tmp/luau/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/luau/build --target Luau.Compile.CLI -j2

      - name: Compile Library.lua
        shell: bash
        run: /tmp/luau/build/luau-compile Library.lua >/dev/null

      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name "Fyntra-Development"
          git config user.email "129816818+Fyntra-Development@users.noreply.github.com"
          git add Library.lua
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refine animated colorpicker UI"
          git push

name: Inspect UI polish targets

on:
  push:
    branches: [agent/groupbox-tab-dropdown-polish]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/groupbox-tab-dropdown-polish
      - name: Print target snippets
        shell: python
        run: |
          from pathlib import Path
          s = Path('Library.lua').read_text()
          markers = [
              'local GroupboxLabelWidth',
              'local PickerOpenSize',
              'function ColorPicker:Show()',
              'function ColorPicker:Hide()',
              "local ListOuter = Library:Create('Frame'",
              "local Scrolling = Library:Create('ScrollingFrame'",
              'function Dropdown:BuildDropdownList()',
              "local TabButton = Library:Create('Frame'",
              "local Blocker = Library:Create('Frame'",
              'function Tab:ShowTab()',
              'function Tab:HideTab()',
              'function Tabbox:AddTab(Name)',
              'function Library:AddTopCorners',
          ]
          for marker in markers:
              print('\n===== ' + marker + ' =====')
              start = s.find(marker)
              if start < 0:
                  print('NOT FOUND')
                  continue
              print(s[max(0, start-500):min(len(s), start+3500)])
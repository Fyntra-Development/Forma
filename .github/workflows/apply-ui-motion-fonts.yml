name: Apply Forma UI motion and fonts

on:
  push:
    branches: [agent/ui-motion-fonts-2]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-motion-fonts-2
          fetch-depth: 0

      - name: Install font validator
        run: python -m pip install --quiet fonttools

      - name: Import repo fonts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fonts
          curl -fL --retry 3 'https://raw.githubusercontent.com/ocornut/imgui/master/misc/fonts/ProggyClean.ttf' -o fonts/ProggyClean.ttf
          curl -fL --retry 3 'https://raw.githubusercontent.com/ocornut/imgui/master/misc/fonts/ProggyTiny.ttf' -o fonts/ProggyTiny.ttf
          curl -fL --retry 3 'https://raw.githubusercontent.com/sametexe001/luas/refs/heads/main/fonts/TAHOMA-8PT-BOLD-WINDOWS-XP.TTF' -o fonts/XP-Tahoma.ttf
          curl -fL --retry 3 'https://raw.githubusercontent.com/sametexe001/luas/main/smallest_pixel-7.ttf' -o fonts/Smallest-Pixel.ttf

          python - <<'PY'
          from fontTools.ttLib import TTFont
          from pathlib import Path

          files = [
              Path('fonts/ProggyClean.ttf'),
              Path('fonts/ProggyTiny.ttf'),
              Path('fonts/XP-Tahoma.ttf'),
              Path('fonts/Smallest-Pixel.ttf'),
          ]

          for path in files:
              font = TTFont(path)
              names = []
              for record in font['name'].names:
                  if record.nameID in {1, 2, 4, 17}:
                      try:
                          names.append(record.toUnicode())
                      except Exception:
                          pass
              if not names:
                  raise SystemExit(f'font has no readable family metadata: {path}')
              print(path, path.stat().st_size, sorted(set(names)))
          PY

      - name: Patch Library
        run: python .github/scripts/patch_ui_motion_fonts.py

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          grep -F "BindNudgeButton(DecreaseOuter, -1);" Library.lua
          grep -F "Library:AddTopCorners(TabButton, 3);" Library.lua
          grep -F "Library:Create('CanvasGroup'" Library.lua
          grep -F "Library:AddCorner(Content, 3);" Library.lua
          grep -F 'ProggyClean.ttf' Library.lua
          grep -F 'Smallest-Pixel.ttf' Library.lua
          test -s fonts/ProggyClean.ttf
          test -s fonts/ProggyTiny.ttf
          test -s fonts/XP-Tahoma.ttf
          test -s fonts/Smallest-Pixel.ttf

      - name: Commit runtime changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Library.lua fonts/ProggyClean.ttf fonts/ProggyTiny.ttf fonts/XP-Tahoma.ttf fonts/Smallest-Pixel.ttf
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Polish UI motion and add repo fonts'
          git push origin HEAD:agent/ui-motion-fonts-2

name: Apply overlay runtime cache fix

on:
  push:
    branches: [agent/fix-overlay-runtime-cache]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-overlay-runtime-cache
          fetch-depth: 0
      - name: Patch ThemeManager
        run: python .github/scripts/fix_overlay_runtime_cache.py
      - name: Verify runtime fix
        shell: bash
        run: |
          grep -q "OverlaySessionId = httpService:GenerateGUID(false)" addons/ThemeManager.lua
          grep -q "function ThemeManager:IsValidOverlayPng" addons/ThemeManager.lua
          grep -q "forma-overlay-" addons/ThemeManager.lua
          grep -q "VisibleAnchor = Vector2.new" addons/ThemeManager.lua
          ! grep -q "needsDownload" addons/ThemeManager.lua
          ! grep -q "CanvasSize = Vector2.new(280" addons/ThemeManager.lua
      - name: Commit runtime fix
        shell: bash
        run: |
          git config user.name "Fyntra-Development"
          git config user.email "129816818+Fyntra-Development@users.noreply.github.com"
          git add addons/ThemeManager.lua
          if ! git diff --cached --quiet; then
            git commit -m "Refresh and validate theme overlay assets"
            git push origin HEAD:agent/fix-overlay-runtime-cache
          fi

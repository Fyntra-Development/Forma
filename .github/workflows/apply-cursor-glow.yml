name: Apply Forma cursor patch

on:
  push:
    branches: [agent/fix-cursor-glow]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-cursor-glow
          fetch-depth: 0
      - run: python3 .github/scripts/patch_cursor_glow.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Library.lua
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use repo cursor and add accent window glow"
          git push origin HEAD:agent/fix-cursor-glow

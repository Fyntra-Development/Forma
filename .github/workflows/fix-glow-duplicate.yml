name: Fix duplicate glow frame

on:
  push:
    branches: [agent/fix-glow-duplicate]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-glow-duplicate
          fetch-depth: 0
      - run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('Library.lua')
          s = p.read_text()

          marker = "    local WindowGlowFrame = Library:Create('Frame', {"
          layers_marker = "    local WindowGlowLayers = {"

          first = s.find(marker)
          second = s.find(marker, first + len(marker)) if first >= 0 else -1
          layers = s.find(layers_marker, second) if second >= 0 else -1

          if first < 0 or second < 0 or layers < 0 or not (first < second < layers):
              raise SystemExit('could not isolate duplicate glow frame')

          s = s[:second] + s[layers:]

          checks = {
              "WindowGlowFrame": s.count("local WindowGlowFrame = Library:Create('Frame'"),
              "WindowGlowLayers": s.count("local WindowGlowLayers = {"),
              "HttpService": s.count("local HttpService = game:GetService('HttpService');"),
              "Fonts": s.count("local Fonts = {"),
              "FontLoader": s.count("function Library:LoadFont(Name)"),
              "TweenProperty": s.count("function Library:TweenProperty(Instance, Property, Value, Duration)"),
          }

          for name, count in checks.items():
              if count != 1:
                  raise SystemExit(f'{name} count is {count}, expected 1')

          p.write_text(s)
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Library.lua
          git commit -m "Remove duplicate glow frame"
          git push origin HEAD:agent/fix-glow-duplicate

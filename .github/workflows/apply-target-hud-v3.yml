name: Apply Target HUD v3

on:
  push:
    branches: [agent/target-hud-autotarget-drag-release]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/target-hud-autotarget-drag-release
          fetch-depth: 0
      - run: python .github/scripts/apply-target-hud-v3.py
      - run: |
          git config user.name "Fyntra-Development"
          git config user.email "129816818+Fyntra-Development@users.noreply.github.com"
          git add Library.lua
          if ! git diff --cached --quiet; then
            git commit -m "Upgrade Target HUD layout and auto targeting"
            git push origin HEAD:agent/target-hud-autotarget-drag-release
          fi

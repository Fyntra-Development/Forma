name: Agent notification accent motion

on:
  push:
    branches:
      - agent/fix-notification-accent-motion

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply notification accent motion patch
        run: python3 .github/agent_notification_accent_patch.py

      - name: Build Luau compiler
        shell: bash
        run: |
          git clone --depth 1 https://github.com/luau-lang/luau.git /tmp/luau
          cmake -S /tmp/luau -B /tmp/luau/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/luau/build --target Luau.Compile.CLI -j2

      - name: Compile Library.lua
        run: /tmp/luau/build/luau-compile Library.lua >/dev/null

      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name "Fyntra-Development"
          git config user.email "129816818+Fyntra-Development@users.noreply.github.com"
          git add Library.lua
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Connect notification accent and progress motion"
          git push

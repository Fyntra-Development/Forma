name: Fix duplicate HttpService

on:
  push:
    branches: [agent/fix-font-service-duplicate]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-font-service-duplicate
          fetch-depth: 0
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Library.lua')
          s = p.read_text()
          duplicate = "local HttpService = game:GetService('HttpService');\nlocal HttpService = game:GetService('HttpService');\n"
          if duplicate not in s:
              raise SystemExit('duplicate HttpService block not found')
          p.write_text(s.replace(duplicate, "local HttpService = game:GetService('HttpService');\n", 1))
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Library.lua
          git commit -m "Remove duplicate HttpService declaration"
          git push origin HEAD:agent/fix-font-service-duplicate

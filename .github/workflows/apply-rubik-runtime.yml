name: Apply Rubik runtime font

on:
  push:
    branches: [agent/use-rubik-by-default]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/use-rubik-by-default
          fetch-depth: 0
      - name: Patch Library.lua
        run: python .github/scripts/use_repo_rubik.py
      - name: Commit runtime font fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Library.lua; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Library.lua
          git commit -m 'Use repo Rubik font by default'
          git push origin HEAD:agent/use-rubik-by-default

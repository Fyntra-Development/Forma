name: Retry theme overlays

on:
  push:
    branches: [agent/theme-overlay-images]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/theme-overlay-images
          fetch-depth: 0
      - name: Use verified EDP chunks
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/scripts/apply_theme_overlays.py')
          s = p.read_text()
          old = "'chunks': [ROOT / '.github/tmp/idfk320/edp445.png.b64'],"
          new = """'chunks': [
              ROOT / '.github/tmp/idfk4096/edp445.png.b64.001',
              ROOT / '.github/tmp/idfk4096/edp445.png.b64.002',
              ROOT / '.github/tmp/idfk4096/edp445.png.b64.003',
          ],"""
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))
      - name: Apply
        run: python .github/scripts/apply_theme_overlays.py
      - name: Commit
        shell: bash
        run: |
          git config user.name "Fyntra-Development"
          git config user.email "129816818+Fyntra-Development@users.noreply.github.com"
          git add Library.lua addons/ThemeManager.lua assets/idfk/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Add selectable theme overlay images"
            git push origin HEAD:agent/theme-overlay-images
          fi

name: Patch control animations

on:
  push:
    branches:
      - agent/smooth-controls

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'Add smooth slider and dropdown animations')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/smooth-controls
          fetch-depth: 0
      - name: Patch Library.lua
        shell: python
        run: |
          from pathlib import Path

          path = Path('Library.lua')
          source = path.read_text()

          old_slider = '''        function Slider:Display()
              local Suffix = Info.Suffix or '';

              if Info.Compact then
                  DisplayLabel.Text = Info.Text .. ': ' .. Slider.Value .. Suffix
              elseif Info.HideMax then
                  DisplayLabel.Text = string.format('%s', Slider.Value .. Suffix)
              else
                  DisplayLabel.Text = string.format('%s/%s', Slider.Value .. Suffix, Slider.Max .. Suffix);
              end

              local X = math.ceil(Library:MapValue(Slider.Value, Slider.Min, Slider.Max, 0, Slider.MaxSize));
              Fill.Size = UDim2.new(0, X, 1, 0);

              HideBorderRight.Visible = not (X == Slider.MaxSize or X == 0);
          end;

          function Slider:OnChanged(Func)
              Slider.Changed = Func;
              Func(Slider.Value);
          end;

          local function Round(Value)
              if Slider.Rounding == 0 then
                  return math.floor(Value);
              end;

              return tonumber(string.format('%.' .. Slider.Rounding .. 'f', Value))
          end;

          function Slider:GetValueFromXOffset(X)
              return Round(Library:MapValue(X, 0, Slider.MaxSize, Slider.Min, Slider.Max));
          end;

          function Slider:SetValue(Str)
              local Num = tonumber(Str);

              if (not Num) then
                  return;
              end;

              Num = math.clamp(Num, Slider.Min, Slider.Max);

              Slider.Value = Num;
              Slider:Display();

              Library:SafeCallback(Slider.Callback, Slider.Value);
              Library:SafeCallback(Slider.Changed, Slider.Value);
          end;

          SliderInner.InputBegan:Connect(function(Input)
              if Input.UserInputType == Enum.UserInputType.MouseButton1 and not Library:MouseIsOverOpenedFrame() then
                  local mPos = Mouse.X;
                  local gPos = Fill.Size.X.Offset;
                  local Diff = mPos - (Fill.AbsolutePosition.X + gPos);

                  while InputService:IsMouseButtonPressed(Enum.UserInputType.MouseButton1) do
                      local nMPos = Mouse.X;
                      local nX = math.clamp(gPos + (nMPos - mPos) + Diff, 0, Slider.MaxSize);

                      local nValue = Slider:GetValueFromXOffset(nX);
                      local OldValue = Slider.Value;
                      Slider.Value = nValue;

                      Slider:Display();

                      if nValue ~= OldValue then
                          Library:SafeCallback(Slider.Callback, Slider.Value);
                          Library:SafeCallback(Slider.Changed, Slider.Value);
                      end;

                      RenderStepped:Wait();
                  end;

                  Library:AttemptSave();
              end;
          end);'''

          new_slider = '''        local VisualX = 0
          local TargetX = 0
          local VisualConnection
          local IsDragging = false

          local function RenderSliderVisual()
              Fill.Size = UDim2.new(0, VisualX, 1, 0)
              HideBorderRight.Visible = VisualX > 0.05 and VisualX < (Slider.MaxSize - 0.05)
          end

          local function StopVisualAnimation()
              if VisualConnection then
                  VisualConnection:Disconnect()
                  VisualConnection = nil
              end
          end

          local function StartVisualAnimation()
              if VisualConnection then
                  return
              end

              VisualConnection = RenderStepped:Connect(function(Delta)
                  if not Fill.Parent then
                      StopVisualAnimation()
                      return
                  end

                  local Speed = IsDragging and 38 or 24
                  local Alpha = 1 - math.exp(-Delta * Speed)
                  VisualX = VisualX + ((TargetX - VisualX) * Alpha)

                  if math.abs(TargetX - VisualX) <= 0.05 then
                      VisualX = TargetX
                  end

                  RenderSliderVisual()

                  if not IsDragging and VisualX == TargetX then
                      StopVisualAnimation()
                  end
              end)
          end

          function Slider:Display(Instant)
              local Suffix = Info.Suffix or '';

              if Info.Compact then
                  DisplayLabel.Text = Info.Text .. ': ' .. Slider.Value .. Suffix
              elseif Info.HideMax then
                  DisplayLabel.Text = string.format('%s', Slider.Value .. Suffix)
              else
                  DisplayLabel.Text = string.format('%s/%s', Slider.Value .. Suffix, Slider.Max .. Suffix);
              end

              TargetX = math.ceil(Library:MapValue(Slider.Value, Slider.Min, Slider.Max, 0, Slider.MaxSize))

              if Instant then
                  StopVisualAnimation()
                  VisualX = TargetX
                  RenderSliderVisual()
              else
                  StartVisualAnimation()
              end
          end;

          function Slider:OnChanged(Func)
              Slider.Changed = Func;
              Func(Slider.Value);
          end;

          local function Round(Value)
              if Slider.Rounding == 0 then
                  return math.floor(Value);
              end;

              return tonumber(string.format('%.' .. Slider.Rounding .. 'f', Value))
          end;

          function Slider:GetValueFromXOffset(X)
              return Round(Library:MapValue(X, 0, Slider.MaxSize, Slider.Min, Slider.Max));
          end;

          function Slider:SetValue(Str)
              local Num = tonumber(Str);

              if (not Num) then
                  return;
              end;

              Num = math.clamp(Num, Slider.Min, Slider.Max);

              Slider.Value = Num;
              Slider:Display(false);

              Library:SafeCallback(Slider.Callback, Slider.Value);
              Library:SafeCallback(Slider.Changed, Slider.Value);
          end;

          SliderInner.InputBegan:Connect(function(Input)
              if Input.UserInputType == Enum.UserInputType.MouseButton1 and not Library:MouseIsOverOpenedFrame() then
                  IsDragging = true

                  local function UpdateFromMouse()
                      local nX = math.clamp(Mouse.X - SliderInner.AbsolutePosition.X, 0, Slider.MaxSize)
                      TargetX = nX
                      StartVisualAnimation()

                      local nValue = Slider:GetValueFromXOffset(nX)
                      local OldValue = Slider.Value

                      if nValue ~= OldValue then
                          Slider.Value = nValue

                          local Suffix = Info.Suffix or ''
                          if Info.Compact then
                              DisplayLabel.Text = Info.Text .. ': ' .. Slider.Value .. Suffix
                          elseif Info.HideMax then
                              DisplayLabel.Text = string.format('%s', Slider.Value .. Suffix)
                          else
                              DisplayLabel.Text = string.format('%s/%s', Slider.Value .. Suffix, Slider.Max .. Suffix)
                          end

                          Library:SafeCallback(Slider.Callback, Slider.Value)
                          Library:SafeCallback(Slider.Changed, Slider.Value)
                      end
                  end

                  UpdateFromMouse()

                  while InputService:IsMouseButtonPressed(Enum.UserInputType.MouseButton1) do
                      UpdateFromMouse()
                      RenderStepped:Wait()
                  end

                  IsDragging = false
                  TargetX = math.ceil(Library:MapValue(Slider.Value, Slider.Min, Slider.Max, 0, Slider.MaxSize))
                  StartVisualAnimation()
                  Library:AttemptSave();
              end;
          end);'''

          if old_slider not in source:
              raise RuntimeError('Could not locate slider implementation')
          source = source.replace(old_slider, new_slider, 1)
          source = source.replace('        Slider:Display();\n        Groupbox:AddBlank(Info.BlankSize or 6);', '        Slider:Display(true);\n        Groupbox:AddBlank(Info.BlankSize or 6);', 1)

          old_outer = '''        local ListOuter = Library:Create('Frame', {
              BackgroundColor3 = Color3.new(0, 0, 0);
              BorderColor3 = Color3.new(0, 0, 0);
              ZIndex = 20;
              Visible = false;
              Parent = ScreenGui;
          });

          local function RecalculateListPosition()
              ListOuter.Position = UDim2.fromOffset(DropdownOuter.AbsolutePosition.X, DropdownOuter.AbsolutePosition.Y + DropdownOuter.Size.Y.Offset + 1);
          end;

          local function RecalculateListSize(YSize)
              ListOuter.Size = UDim2.fromOffset(DropdownOuter.AbsoluteSize.X, YSize or (MAX_DROPDOWN_ITEMS * 20 + 2))
          end;'''

          new_outer = '''        local ListOuter = Library:Create('Frame', {
              BackgroundColor3 = Color3.new(0, 0, 0);
              BorderColor3 = Color3.new(0, 0, 0);
              ClipsDescendants = true;
              Size = UDim2.fromOffset(DropdownOuter.AbsoluteSize.X, 0);
              ZIndex = 20;
              Visible = false;
              Parent = ScreenGui;
          });

          local ListHeight = MAX_DROPDOWN_ITEMS * 20 + 2

          local function RecalculateListPosition()
              ListOuter.Position = UDim2.fromOffset(DropdownOuter.AbsolutePosition.X, DropdownOuter.AbsolutePosition.Y + DropdownOuter.Size.Y.Offset + 1);
          end;

          local function RecalculateListSize(YSize)
              ListHeight = YSize or (MAX_DROPDOWN_ITEMS * 20 + 2)
              ListOuter.Size = UDim2.fromOffset(DropdownOuter.AbsoluteSize.X, Dropdown.Opened and ListHeight or 0)
          end;'''

          if old_outer not in source:
              raise RuntimeError('Could not locate dropdown outer implementation')
          source = source.replace(old_outer, new_outer, 1)

          source = source.replace("            BackgroundColor3 = Library.MainColor;\n            BorderColor3 = Library.OutlineColor;\n            BorderMode = Enum.BorderMode.Inset;\n            BorderSizePixel = 0;\n            Size = UDim2.new(1, 0, 1, 0);\n            ZIndex = 21;\n            Parent = ListOuter;", "            BackgroundColor3 = Library.MainColor;\n            BackgroundTransparency = 1;\n            BorderColor3 = Library.OutlineColor;\n            BorderMode = Enum.BorderMode.Inset;\n            BorderSizePixel = 0;\n            Size = UDim2.new(1, 0, 1, 0);\n            ZIndex = 21;\n            Parent = ListOuter;", 1)

          old_open_close = '''        function Dropdown:OpenDropdown()
              ListOuter.Visible = true;
              Library.OpenedFrames[ListOuter] = true;
              DropdownArrow.Rotation = 180;
          end;

          function Dropdown:CloseDropdown()
              ListOuter.Visible = false;
              Library.OpenedFrames[ListOuter] = nil;
              DropdownArrow.Rotation = 0;
          end;'''

          new_open_close = '''        local DropdownTweens = {}
          local DropdownAnimationId = 0

          local function CancelDropdownTweens()
              for _, Tween in next, DropdownTweens do
                  pcall(function()
                      Tween:Cancel()
                  end)
              end

              table.clear(DropdownTweens)
          end

          local function PlayDropdownTween(Instance, InfoValue, Properties)
              local Tween = TweenService:Create(Instance, InfoValue, Properties)
              table.insert(DropdownTweens, Tween)
              Tween:Play()
              return Tween
          end

          function Dropdown:OpenDropdown()
              if Dropdown.Opened then
                  return
              end

              Dropdown.Opened = true
              DropdownAnimationId = DropdownAnimationId + 1
              CancelDropdownTweens()

              ListOuter.Visible = true
              Library.OpenedFrames[ListOuter] = true

              local ExpandInfo = TweenInfo.new(0.26, Enum.EasingStyle.Quint, Enum.EasingDirection.Out)
              local FadeInfo = TweenInfo.new(0.18, Enum.EasingStyle.Quad, Enum.EasingDirection.Out)
              local ArrowInfo = TweenInfo.new(0.24, Enum.EasingStyle.Quart, Enum.EasingDirection.Out)

              PlayDropdownTween(ListOuter, ExpandInfo, {
                  Size = UDim2.fromOffset(DropdownOuter.AbsoluteSize.X, ListHeight),
              })

              PlayDropdownTween(ListInner, FadeInfo, {
                  BackgroundTransparency = 0,
              })

              PlayDropdownTween(DropdownArrow, ArrowInfo, {
                  Rotation = 180,
              })
          end;

          function Dropdown:CloseDropdown()
              if not Dropdown.Opened and not ListOuter.Visible then
                  return
              end

              Dropdown.Opened = false
              DropdownAnimationId = DropdownAnimationId + 1
              local CurrentId = DropdownAnimationId
              CancelDropdownTweens()
              Library.OpenedFrames[ListOuter] = nil

              local CollapseInfo = TweenInfo.new(0.2, Enum.EasingStyle.Quart, Enum.EasingDirection.InOut)
              local FadeInfo = TweenInfo.new(0.14, Enum.EasingStyle.Quad, Enum.EasingDirection.Out)
              local ArrowInfo = TweenInfo.new(0.2, Enum.EasingStyle.Quart, Enum.EasingDirection.Out)

              local CollapseTween = PlayDropdownTween(ListOuter, CollapseInfo, {
                  Size = UDim2.fromOffset(DropdownOuter.AbsoluteSize.X, 0),
              })

              PlayDropdownTween(ListInner, FadeInfo, {
                  BackgroundTransparency = 1,
              })

              PlayDropdownTween(DropdownArrow, ArrowInfo, {
                  Rotation = 0,
              })

              CollapseTween.Completed:Connect(function()
                  if CurrentId ~= DropdownAnimationId or Dropdown.Opened then
                      return
                  end

                  ListOuter.Visible = false
                  table.clear(DropdownTweens)
              end)
          end;'''

          if old_open_close not in source:
              raise RuntimeError('Could not locate dropdown open/close implementation')
          source = source.replace(old_open_close, new_open_close, 1)
          source = source.replace('                if ListOuter.Visible then\n                    Dropdown:CloseDropdown();\n                else\n                    Dropdown:OpenDropdown();\n                end;', '                if Dropdown.Opened then\n                    Dropdown:CloseDropdown();\n                else\n                    Dropdown:OpenDropdown();\n                end;', 1)
          source = source.replace("            if Input.UserInputType == Enum.UserInputType.MouseButton1 then\n                local AbsPos, AbsSize = ListOuter.AbsolutePosition, ListOuter.AbsoluteSize;", "            if Input.UserInputType == Enum.UserInputType.MouseButton1 and Dropdown.Opened then\n                local AbsPos, AbsSize = ListOuter.AbsolutePosition, ListOuter.AbsoluteSize;", 1)

          path.write_text(source)
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Library.lua
          git commit -m "Add smooth slider and dropdown animations"
          git push origin HEAD:agent/smooth-controls

name: Agent fix tooltip syntax

on:
  push:
    branches:
      - agent/fix-tooltip-syntax

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-tooltip-syntax
      - name: Fix missing Connect parenthesis
        shell: python
        run: |
          from pathlib import Path

          path = Path("Library.lua")
          source = path.read_text(encoding="utf-8")
          old = """    HoverInstance.MouseEnter:Connect(function()\n        if Library:MouseIsOverOpenedFrame() then\n            return\n        end\n\n        Show()\n    end\n\n    HoverInstance.MouseLeave:Connect(Hide)"""
          new = """    HoverInstance.MouseEnter:Connect(function()\n        if Library:MouseIsOverOpenedFrame() then\n            return\n        end\n\n        Show()\n    end)\n\n    HoverInstance.MouseLeave:Connect(Hide)"""
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one tooltip syntax target, found {count}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Library.lua
          git commit -m "Fix tooltip MouseEnter callback syntax"
          git push origin HEAD:agent/fix-tooltip-syntax

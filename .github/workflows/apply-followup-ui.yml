name: Apply follow-up UI fixes

on:
  push:
    branches: [agent/fix-tabs-picker-slider-legend]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-tabs-picker-slider-legend
          fetch-depth: 0
      - name: Patch Library
        run: python .github/scripts/patch_followup_ui.py
      - name: Verify patch
        shell: python
        run: |
          from pathlib import Path
          s = Path('Library.lua').read_text()
          required = [
              "function Library:AddTabAccentCap(Instance)",
              "Size = UDim2.fromScale(1, 1);",
              "local PickerFrameOuter = Library:Create('CanvasGroup'",
              "GroupTransparency = 0;",
              "local ValueEditHitbox = Library:Create('TextButton'",
              "ValueEditHitbox.MouseButton1Click:Connect(function()",
              "local ListInner = Library:Create('CanvasGroup'",
              "DropdownGradient:Clone().Parent = ListOuter;",
              "local Button = Library:Create('Frame', {",
              "Position = UDim2.new(0.5, 0, 0, 0);",
          ]
          for token in required:
              assert token in s, token
          group_start = s.index('        function Tab:AddGroupbox(Info)')
          group_end = s.index('        function Tab:AddLeftGroupbox(Name)', group_start)
          group = s[group_start:group_end]
          assert "local Highlight = Library:Create('Frame'" not in group
          assert "GroupTransparency = 1;\n                    Size = UDim2.new(1, -5, 0, 20);" not in s
          add_top = s[s.index('function Library:AddTopCorners'):s.index('function Library:AddTabAccentCap')]
          assert 'LeftEdge' not in add_top and 'RightEdge' not in add_top and 'BottomEdge' not in add_top
          print('verification passed')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Fyntra-Development"
          git config user.email "129816818+Fyntra-Development@users.noreply.github.com"
          git add Library.lua
          if ! git diff --cached --quiet; then
            git commit -m "Fix tabs picker slider editing and groupbox legends"
            git push origin HEAD:agent/fix-tabs-picker-slider-legend
          fi

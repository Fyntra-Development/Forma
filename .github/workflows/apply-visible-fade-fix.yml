name: Apply visible fade fix

on:
  push:
    branches: [agent/fix-visible-fades-layout]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-visible-fades-layout
          fetch-depth: 0
      - name: Patch runtime
        run: python .github/scripts/visible_fade_fix.py
      - name: Verify requested behavior
        shell: bash
        run: |
          grep -q "function Library:TweenFadeTree(Root, Hidden, Duration)" Library.lua
          grep -q "Library:TweenFadeTree(PickerFrameOuter, false, 0.26)" Library.lua
          grep -q "Library:TweenFadeTree(ListOuter, false, 0.24)" Library.lua
          grep -q "Library:TweenFadeTree(TabFrame, Hidden, Duration)" Library.lua
          grep -q "Library:TweenFadeTree(Container, false, 0.22)" Library.lua
          grep -q "Library:TweenFadeTree(Holder, false, 0.20)" Library.lua
          grep -q "VisibleAnchor = Vector2.new(0.08, 0.855)" addons/ThemeManager.lua
          ! grep -q "CanvasGroup" Library.lua
          ! grep -q "GroupTransparency" Library.lua
      - name: Commit runtime changes
        shell: bash
        run: |
          git config user.name "Fyntra-Development"
          git config user.email "129816818+Fyntra-Development@users.noreply.github.com"
          git add Library.lua addons/ThemeManager.lua
          if ! git diff --cached --quiet; then
            git commit -m "Fix visible fades and overlay layout"
            git push origin HEAD:agent/fix-visible-fades-layout
          fi

name: Finalize tab indicator layout

on:
  push:
    branches: [agent/tab-motion-theme-polish]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tab-motion-theme-polish
          fetch-depth: 0
      - name: Apply layout follow-up
        run: python .github/scripts/finalize_tab_indicator_layout.py
      - name: Verify layout follow-up
        shell: bash
        run: |
          grep -q "Window.ActiveTab.Button" Library.lua
          grep -q "Tab.Button = TabButton" Library.lua
          grep -q "Tab.Button = Button" Library.lua
          grep -q "for _, Child in next, TabboxButtons:GetChildren()" Library.lua
      - name: Commit follow-up
        shell: bash
        run: |
          git config user.name "Fyntra-Development"
          git config user.email "129816818+Fyntra-Development@users.noreply.github.com"
          git add Library.lua
          if ! git diff --cached --quiet; then
            git commit -m "Keep tab indicators aligned after layout changes"
            git push origin HEAD:agent/tab-motion-theme-polish
          fi

name: Apply smooth menu outline and unified fade

on:
  push:
    branches: [agent/smooth-menu-outline-unified-fade]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/smooth-menu-outline-unified-fade
          fetch-depth: 0
      - name: Patch runtime
        run: python .github/scripts/smooth-menu-outline-unified-fade.py
      - name: Verify behavior tokens
        shell: bash
        run: |
          grep -q "function Library:SetUnifiedFadeProgress" Library.lua
          grep -q "function Library:TweenUnifiedFade" Library.lua
          grep -q "function Library:AddAccentOutline" Library.lua
          grep -q "Library:AddAccentOutline(KeybindInner, 1)" Library.lua
          grep -q "Library:AddAccentOutline(Inner, 0.95)\|Library:AddAccentOutline(Inner, 1)" Library.lua
          grep -q "GetDragSmoothTime" addons/MenuManager.lua
          grep -q "GetReleaseDuration" addons/MenuManager.lua
          grep -q "menuManager:BuildMenuSection(tab)" addons/ThemeManager.lua
          ! grep -q "groupbox:AddLabel('Menu manager')" addons/ThemeManager.lua
          ! grep -q "FormaMenuScale" Library.lua
          ! grep -q "local Fading = false" Library.lua
      - name: Commit runtime changes
        shell: bash
        run: |
          git config user.name "Fyntra-Development"
          git config user.email "129816818+Fyntra-Development@users.noreply.github.com"
          git add Library.lua addons/ThemeManager.lua addons/MenuManager.lua
          if ! git diff --cached --quiet; then
            git commit -m "Polish MenuManager dragging fades and outlines"
            git push origin HEAD:agent/smooth-menu-outline-unified-fade
          fi

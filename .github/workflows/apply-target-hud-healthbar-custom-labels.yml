name: Apply Target HUD healthbar and labels

on:
  push:
    branches: [agent/target-hud-healthbar-custom-labels]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/target-hud-healthbar-custom-labels
          fetch-depth: 0
      - name: Patch Library
        run: python .github/scripts/target-hud-healthbar-custom-labels.py
      - name: Verify Target HUD
        shell: bash
        run: |
          grep -q "FormaTargetHealthDriver" Library.lua
          grep -q "function HUD:AddLabel" Library.lua
          grep -q "function HUD:SetMeter" Library.lua
          grep -q "function HUD:SetHealth" Library.lua
          grep -q "HealthGradient.Color" Library.lua
          grep -q "WatermarkTextOutline" Library.lua
          python - <<'PY'
          from pathlib import Path
          s = Path('Library.lua').read_text()
          a = s.index('function Library:CreateTargetHUD(Config)')
          b = s.index('function Library:Notify(Text, Time)', a)
          block = s[a:b]
          assert block.count('function Library:CreateTargetHUD') == 1
          assert "local InfoLabel =" not in block
          assert "HUD.InfoLabel = nil" in block
          assert "TweenInfo.new(tonumber(Config.HealthTweenTime) or 0.38" in block
          PY
      - name: Commit runtime change
        shell: bash
        run: |
          git config user.name "Fyntra-Development"
          git config user.email "129816818+Fyntra-Development@users.noreply.github.com"
          git add Library.lua
          if ! git diff --cached --quiet; then
            git commit -m "Upgrade Target HUD health and labels"
            git push origin HEAD:agent/target-hud-healthbar-custom-labels
          fi

name: Finalize UI polish

on:
  push:
    branches: [agent/ui-polish-pass]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-polish-pass
          fetch-depth: 0
      - name: Apply final refinements
        run: python .github/scripts/finalize_ui_polish.py
      - name: Verify final refinements
        shell: bash
        run: |
          grep -q "{ 2.18, 0.95 }" Library.lua
          grep -q "Target ~= 0 or Tab.Active" Library.lua
          grep -q "DisplayLabel:GetPropertyChangedSignal('TextBounds')" Library.lua
      - name: Commit final refinements
        shell: bash
        run: |
          git config user.name "Fyntra-Development"
          git config user.email "129816818+Fyntra-Development@users.noreply.github.com"
          git add Library.lua
          if ! git diff --cached --quiet; then
            git commit -m "Finalize UI polish behavior"
            git push origin HEAD:agent/ui-polish-pass
          fi

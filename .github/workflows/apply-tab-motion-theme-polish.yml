name: Apply tab motion and theme polish

on:
  push:
    branches: [agent/tab-motion-theme-polish]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tab-motion-theme-polish
          fetch-depth: 0
      - name: Patch library and theme manager
        run: python .github/scripts/patch_tab_motion_theme.py
      - name: Verify requested behavior
        shell: bash
        run: |
          grep -q "function Library:CreateSlidingTabIndicator" Library.lua
          grep -q "TweenPickerFade(false, 0.24)" Library.lua
          grep -q "ThemeManager_TextSize" addons/ThemeManager.lua
          grep -q "marin-kitagawa.png" addons/ThemeManager.lua
          grep -q "CanvasGroup.*TabFrame\|Name = 'TabFrame'" Library.lua
          ! grep -q "SetTabAccentActive" Library.lua
          ! grep -q "SetTabboxAccentActive" Library.lua
      - name: Commit runtime changes
        shell: bash
        run: |
          git config user.name "Fyntra-Development"
          git config user.email "129816818+Fyntra-Development@users.noreply.github.com"
          git add Library.lua addons/ThemeManager.lua
          if ! git diff --cached --quiet; then
            git commit -m "Polish tab motion and theme controls"
            git push origin HEAD:agent/tab-motion-theme-polish
          fi

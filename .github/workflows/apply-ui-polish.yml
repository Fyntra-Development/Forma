name: Apply Forma selected-state fades

on:
  push:
    branches: [agent/ui-polish-fonts]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-polish-fonts
          fetch-depth: 0
      - run: python3 .github/scripts/apply_selected_fades.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Library.lua
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fade selected UI states"
          git push origin HEAD:agent/ui-polish-fonts

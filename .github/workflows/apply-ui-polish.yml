name: Apply Forma UI polish

on:
  push:
    branches: [agent/ui-polish-fonts]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-polish-fonts
          fetch-depth: 0
      - run: python3 .github/scripts/apply_ui_polish.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Library.lua addons/ThemeManager.lua
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Polish cursor glow outlines and fonts"
          git push origin HEAD:agent/ui-polish-fonts

name: Finalize tab layering

on:
  push:
    branches: [agent/groupbox-tab-dropdown-polish]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/groupbox-tab-dropdown-polish
      - name: Correct lower tab surface layering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Library.lua')
          s = p.read_text()
          start = s.index('function Library:AddTopCorners')
          end = s.index('function Library:AddTabAccentCap', start)
          block = s[start:end]
          old = '        ZIndex = Instance.ZIndex + 1;\n'
          assert block.count(old) == 1
          block = block.replace(old, '        ZIndex = Instance.ZIndex;\n', 1)
          p.write_text(s[:start] + block + s[end:])
          PY
          git config user.name "Fyntra-Development"
          git config user.email "129816818+Fyntra-Development@users.noreply.github.com"
          git add Library.lua
          git commit -m "Keep tab corner fill below labels"
          git push origin HEAD:agent/groupbox-tab-dropdown-polish
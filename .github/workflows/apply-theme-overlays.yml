name: Apply theme overlay assets

on:
  push:
    branches: [agent/theme-overlay-images]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/theme-overlay-images
          fetch-depth: 0

      - name: Decode assets and patch runtime
        run: python .github/scripts/apply_theme_overlays.py

      - name: Verify final runtime payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          expected = {
              'assets/idfk/edp445.png': '1bcd41916c71568a41472bc62c4371db5a0043872af531205b448d143a2772fb',
              'assets/idfk/janedoe.png': '79d37fc236beb884ff96f275b1859645350e88ca09db27dc65245b110005449e',
              'assets/idfk/ibuki.png': 'f2eed0a2f02cb5d0f65a788541a5471b23836586d4e3b4f8ebafbdc7c2956f75',
          }

          for path, digest in expected.items():
              data = Path(path).read_bytes()
              assert hashlib.sha256(data).hexdigest() == digest, path
              assert data.startswith(b'\x89PNG\r\n\x1a\n'), path

          library = Path('Library.lua').read_text()
          theme = Path('addons/ThemeManager.lua').read_text()
          assert library.count('Library.WindowHolder = Outer;') == 1
          assert "ThemeManager.OverlayEnabled = false" in theme
          assert "Default = false" in theme
          assert "ThemeManager.OverlayOrder = { 'EDP445', 'Jane Doe', 'Ibuki' }" in theme
          assert "Parent = holder;" in theme
          assert "ZIndex = 500;" in theme
          print('verification passed')
          PY

      - name: Commit runtime changes
        shell: bash
        run: |
          git config user.name "Fyntra-Development"
          git config user.email "129816818+Fyntra-Development@users.noreply.github.com"
          git add Library.lua addons/ThemeManager.lua assets/idfk/edp445.png assets/idfk/janedoe.png assets/idfk/ibuki.png
          if ! git diff --cached --quiet; then
            git commit -m "Add selectable theme overlay images"
            git push origin HEAD:agent/theme-overlay-images
          fi

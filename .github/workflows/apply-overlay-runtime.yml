name: Apply overlay runtime

on:
  push:
    branches: [agent/theme-overlay-images]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/theme-overlay-images
          fetch-depth: 0
      - name: Patch Lua only
        shell: python
        run: |
          from pathlib import Path
          source = Path('.github/scripts/apply_theme_overlays.py').read_text()
          start = source.index("library_path = ROOT / 'Library.lua'")
          code = "from pathlib import Path\nROOT = Path('.')\n" + source[start:]
          exec(compile(code, 'overlay_runtime_patch.py', 'exec'))
      - name: Commit runtime
        shell: bash
        run: |
          git config user.name "Fyntra-Development"
          git config user.email "129816818+Fyntra-Development@users.noreply.github.com"
          git add Library.lua addons/ThemeManager.lua
          if ! git diff --cached --quiet; then
            git commit -m "Wire selectable theme overlays"
            git push origin HEAD:agent/theme-overlay-images
          fi

name: Apply Forma slider polish

on:
  push:
    branches: [agent/slider-value-buttons-rounding]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/slider-value-buttons-rounding
          fetch-depth: 0

      - name: Patch slider and control rounding
        run: python .github/scripts/patch_slider_polish.py

      - name: Commit slider polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Library.lua
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add slider value badge, nudge buttons, and rounded controls'
          git push origin HEAD:agent/slider-value-buttons-rounding

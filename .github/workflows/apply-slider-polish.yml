name: Apply Forma slider polish

on:
  push:
    branches: [agent/slider-value-buttons-rounding]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/slider-value-buttons-rounding
          fetch-depth: 0

      - name: Patch slider and control rounding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('Library.lua')
          source = path.read_text()

          create_anchor = """    return _Instance;\nend;\n\nfunction Library:ApplyTextStroke"""
          helper = """    return _Instance;\nend;\n\nfunction Library:AddCorner(Instance, Radius)\n    if not Instance then\n        return nil;\n    end;\n\n    local Corner = Instance:FindFirstChildOfClass('UICorner');\n    if not Corner then\n        Corner = Library:Create('UICorner', {\n            Parent = Instance;\n        });\n    end;\n\n    Corner.CornerRadius = UDim.new(0, Radius or 3);\n    return Corner;\nend;\n\nfunction Library:ApplyTextStroke"""
          if 'function Library:AddCorner' not in source:
              if source.count(create_anchor) != 1:
                  raise SystemExit('Create helper anchor not found exactly once')
              source = source.replace(create_anchor, helper, 1)

          if source.count('local WindowCornerRadius = UDim.new(0, 2);') != 1:
              raise SystemExit('window radius token missing')
          source = source.replace('local WindowCornerRadius = UDim.new(0, 2);', 'local WindowCornerRadius = UDim.new(0, 3);', 1)

          def round_named_pair(text, outer, inner):
              pattern = rf"(local {re.escape(inner)} = Library:Create\('Frame', \{{.*?Parent = {re.escape(outer)};\n\s*\}}\);)"
              replacement = rf"\1\n\n        Library:AddCorner({outer}, 3);\n        Library:AddCorner({inner}, 3);"
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'rounding pair failed: {outer}/{inner}: {count}')
              return updated

          source = round_named_pair(source, 'TextBoxOuter', 'TextBoxInner')
          source = round_named_pair(source, 'ToggleOuter', 'ToggleInner')
          source = round_named_pair(source, 'DropdownOuter', 'DropdownInner')

          button_start = source.index('        local function CreateBaseButton(Button)')
          button_end = source.index('        local function InitEvents(Button)', button_start)
          button_block = source[button_start:button_end]
          if 'Library:AddCorner(Outer, 3);' not in button_block:
              marker = """                Parent = Outer;\n            });\n\n            local Label = Library:CreateLabel({"""
              replacement = """                Parent = Outer;\n            });\n\n            Library:AddCorner(Outer, 3);\n            Library:AddCorner(Inner, 3);\n\n            local Label = Library:CreateLabel({"""
              if button_block.count(marker) != 1:
                  raise SystemExit('button corner anchor missing')
              button_block = button_block.replace(marker, replacement, 1)
              source = source[:button_start] + button_block + source[button_end:]

          slider_function = r'''    function Funcs:AddSlider(Idx, Info)
        assert(Info.Default, 'AddSlider: Missing default value.');
        assert(Info.Text, 'AddSlider: Missing slider text.');
        assert(Info.Min, 'AddSlider: Missing minimum value.');
        assert(Info.Max, 'AddSlider: Missing maximum value.');
        assert(Info.Rounding, 'AddSlider: Missing rounding value.');

        local Slider = {
            Value = Info.Default;
            Min = Info.Min;
            Max = Info.Max;
            Rounding = Info.Rounding;
            MaxSize = 1;
            Step = tonumber(Info.Step or Info.Increment);
            Type = 'Slider';
            Callback = Info.Callback or function(Value) end;
        };

        if not Slider.Step or Slider.Step <= 0 then
            Slider.Step = Slider.Rounding == 0 and 1 or (10 ^ -Slider.Rounding);
        end;

        local Groupbox = self;
        local Container = Groupbox.Container;

        if not Info.Compact then
            Library:CreateLabel({
                Size = UDim2.new(1, 0, 0, 10);
                TextSize = 14;
                Text = Info.Text;
                TextXAlignment = Enum.TextXAlignment.Left;
                TextYAlignment = Enum.TextYAlignment.Bottom;
                ZIndex = 5;
                Parent = Container;
            });

            Groupbox:AddBlank(3);
        end

        local SliderRow = Library:Create('Frame', {
            BackgroundTransparency = 1;
            Size = UDim2.new(1, -4, 0, 13);
            ZIndex = 5;
            Parent = Container;
        });

        local function CreateNudgeButton(Text, Position, AnchorPoint)
            local Outer = Library:Create('Frame', {
                AnchorPoint = AnchorPoint;
                BackgroundColor3 = Color3.new(0, 0, 0);
                BorderColor3 = Color3.new(0, 0, 0);
                Position = Position;
                Size = UDim2.fromOffset(17, 13);
                ZIndex = 6;
                Parent = SliderRow;
            });

            local Inner = Library:Create('Frame', {
                BackgroundColor3 = Library.MainColor;
                BorderColor3 = Library.OutlineColor;
                BorderMode = Enum.BorderMode.Inset;
                Size = UDim2.fromScale(1, 1);
                ZIndex = 7;
                Parent = Outer;
            });

            Library:AddCorner(Outer, 3);
            Library:AddCorner(Inner, 3);

            Library:AddToRegistry(Outer, {
                BorderColor3 = 'Black';
            });

            Library:AddToRegistry(Inner, {
                BackgroundColor3 = 'MainColor';
                BorderColor3 = 'OutlineColor';
            });

            local Label = Library:CreateLabel({
                BackgroundTransparency = 1;
                Size = UDim2.fromScale(1, 1);
                Text = Text;
                TextSize = 14;
                ZIndex = 8;
                Parent = Inner;
            });

            Library:OnHighlight(Outer, Outer,
                { BorderColor3 = 'AccentColor' },
                { BorderColor3 = 'Black' }
            );

            return Outer, Inner, Label;
        end;

        local DecreaseOuter = CreateNudgeButton('−', UDim2.new(0, 0, 0.5, 0), Vector2.new(0, 0.5));
        local IncreaseOuter = CreateNudgeButton('+', UDim2.new(1, 0, 0.5, 0), Vector2.new(1, 0.5));

        local SliderOuter = Library:Create('Frame', {
            BackgroundColor3 = Color3.new(0, 0, 0);
            BorderColor3 = Color3.new(0, 0, 0);
            Position = UDim2.fromOffset(20, 0);
            Size = UDim2.new(1, -40, 0, 13);
            ZIndex = 5;
            Parent = SliderRow;
        });

        local SliderInner = Library:Create('Frame', {
            BackgroundColor3 = Library.MainColor;
            BorderColor3 = Library.OutlineColor;
            BorderMode = Enum.BorderMode.Inset;
            Size = UDim2.fromScale(1, 1);
            ZIndex = 6;
            Parent = SliderOuter;
        });

        Library:AddCorner(SliderOuter, 3);
        Library:AddCorner(SliderInner, 3);

        Library:AddToRegistry(SliderOuter, {
            BorderColor3 = 'Black';
        });

        Library:AddToRegistry(SliderInner, {
            BackgroundColor3 = 'MainColor';
            BorderColor3 = 'OutlineColor';
        });

        local Fill = Library:Create('Frame', {
            BackgroundColor3 = Library.AccentColor;
            BorderColor3 = Library.AccentColorDark;
            Size = UDim2.new(0, 0, 1, 0);
            ZIndex = 7;
            Parent = SliderInner;
        });

        Library:AddCorner(Fill, 3);

        Library:AddToRegistry(Fill, {
            BackgroundColor3 = 'AccentColor';
            BorderColor3 = 'AccentColorDark';
        });

        local CompactLabel;
        if Info.Compact then
            CompactLabel = Library:CreateLabel({
                BackgroundTransparency = 1;
                Position = UDim2.fromOffset(5, 0);
                Size = UDim2.new(1, -10, 1, 0);
                Text = Info.Text;
                TextSize = 13;
                TextXAlignment = Enum.TextXAlignment.Left;
                ZIndex = 8;
                Parent = SliderInner;
            });
        end;

        local Thumb = Library:Create('Frame', {
            AnchorPoint = Vector2.new(0.5, 0.5);
            BackgroundColor3 = Library.AccentColor;
            BorderColor3 = Library.AccentColorDark;
            Position = UDim2.new(0, 0, 0.5, 0);
            Size = UDim2.fromOffset(7, 13);
            ZIndex = 10;
            Parent = SliderRow;
        });

        Library:AddCorner(Thumb, 3);
        Library:AddToRegistry(Thumb, {
            BackgroundColor3 = 'AccentColor';
            BorderColor3 = 'AccentColorDark';
        });

        local ValueBadge = Library:Create('Frame', {
            AnchorPoint = Vector2.new(0, 0.5);
            BackgroundColor3 = Library.BackgroundColor;
            BorderColor3 = Library.OutlineColor;
            BorderMode = Enum.BorderMode.Inset;
            Position = UDim2.new(0, 0, 0.5, 0);
            Size = UDim2.fromOffset(46, 13);
            ZIndex = 11;
            Parent = SliderRow;
        });

        Library:AddCorner(ValueBadge, 3);
        Library:AddToRegistry(ValueBadge, {
            BackgroundColor3 = 'BackgroundColor';
            BorderColor3 = 'OutlineColor';
        });

        local ValueLabel = Library:CreateLabel({
            BackgroundTransparency = 1;
            Size = UDim2.fromScale(1, 1);
            Text = tostring(Slider.Value);
            TextSize = 13;
            ZIndex = 12;
            Parent = ValueBadge;
        });

        Library:OnHighlight(SliderOuter, SliderOuter,
            { BorderColor3 = 'AccentColor' },
            { BorderColor3 = 'Black' }
        );

        if type(Info.Tooltip) == 'string' or type(Info.Tooltip) == 'table' then
            Library:AddToolTip(Info.Tooltip, SliderRow)
        end

        function Slider:UpdateColors()
            Fill.BackgroundColor3 = Library.AccentColor;
            Fill.BorderColor3 = Library.AccentColorDark;
            Thumb.BackgroundColor3 = Library.AccentColor;
            Thumb.BorderColor3 = Library.AccentColorDark;
        end;

        local VisualX = 0;
        local TargetX = 0;
        local VisualConnection;
        local IsDragging = false;

        local function TrackWidth()
            local Width = SliderInner.AbsoluteSize.X;
            if Width <= 0 then
                Width = math.max(SliderRow.AbsoluteSize.X - 40, 1);
            end;
            Slider.MaxSize = math.max(Width, 1);
            return Slider.MaxSize;
        end;

        local function RenderSliderVisual()
            local Width = TrackWidth();
            VisualX = math.clamp(VisualX, 0, Width);

            Fill.Size = UDim2.new(0, VisualX, 1, 0);

            local ThumbX = SliderOuter.Position.X.Offset + VisualX;
            Thumb.Position = UDim2.new(0, ThumbX, 0.5, 0);

            local BadgeWidth = ValueBadge.Size.X.Offset;
            local RowWidth = SliderRow.AbsoluteSize.X;
            local PutRight = (ThumbX + 7 + BadgeWidth) <= RowWidth;

            if PutRight then
                ValueBadge.AnchorPoint = Vector2.new(0, 0.5);
                ValueBadge.Position = UDim2.new(0, ThumbX + 7, 0.5, 0);
            else
                ValueBadge.AnchorPoint = Vector2.new(1, 0.5);
                ValueBadge.Position = UDim2.new(0, ThumbX - 7, 0.5, 0);
            end;
        end;

        local function StopVisualAnimation()
            if VisualConnection then
                VisualConnection:Disconnect();
                VisualConnection = nil;
            end;
        end;

        local function StartVisualAnimation()
            if VisualConnection then
                return;
            end;

            VisualConnection = RenderStepped:Connect(function(Delta)
                if not Fill.Parent then
                    StopVisualAnimation();
                    return;
                end;

                local Speed = IsDragging and 38 or 24;
                local Alpha = 1 - math.exp(-Delta * Speed);
                VisualX = VisualX + ((TargetX - VisualX) * Alpha);

                if math.abs(TargetX - VisualX) <= 0.05 then
                    VisualX = TargetX;
                end;

                RenderSliderVisual();

                if not IsDragging and VisualX == TargetX then
                    StopVisualAnimation();
                end;
            end);
        end;

        local function Round(Value)
            if Slider.Rounding == 0 then
                return math.floor(Value);
            end;

            return tonumber(string.format('%.' .. Slider.Rounding .. 'f', Value));
        end;

        function Slider:Display(Instant)
            local Suffix = Info.Suffix or '';
            ValueLabel.Text = tostring(Slider.Value) .. Suffix;

            local LabelWidth = math.clamp(ValueLabel.TextBounds.X + 12, 32, 72);
            ValueBadge.Size = UDim2.fromOffset(LabelWidth, 13);

            local Width = TrackWidth();
            TargetX = Library:MapValue(Slider.Value, Slider.Min, Slider.Max, 0, Width);

            if Instant then
                StopVisualAnimation();
                VisualX = TargetX;
                RenderSliderVisual();
            else
                StartVisualAnimation();
            end;
        end;

        function Slider:OnChanged(Func)
            Slider.Changed = Func;
            Func(Slider.Value);
        end;

        function Slider:GetValueFromXOffset(X)
            return Round(Library:MapValue(X, 0, TrackWidth(), Slider.Min, Slider.Max));
        end;

        function Slider:SetValue(Str)
            local Num = tonumber(Str);
            if not Num then
                return;
            end;

            Num = Round(math.clamp(Num, Slider.Min, Slider.Max));
            Slider.Value = Num;
            Slider:Display(false);

            Library:SafeCallback(Slider.Callback, Slider.Value);
            Library:SafeCallback(Slider.Changed, Slider.Value);
        end;

        local function Nudge(Direction)
            Slider:SetValue(Slider.Value + (Slider.Step * Direction));
            Library:AttemptSave();
        end;

        DecreaseOuter.InputBegan:Connect(function(Input)
            if Input.UserInputType == Enum.UserInputType.MouseButton1 and not Library:MouseIsOverOpenedFrame() then
                Nudge(-1);
            end;
        end);

        IncreaseOuter.InputBegan:Connect(function(Input)
            if Input.UserInputType == Enum.UserInputType.MouseButton1 and not Library:MouseIsOverOpenedFrame() then
                Nudge(1);
            end;
        end);

        SliderInner.InputBegan:Connect(function(Input)
            if Input.UserInputType == Enum.UserInputType.MouseButton1 and not Library:MouseIsOverOpenedFrame() then
                IsDragging = true;

                local function UpdateFromMouse()
                    local Width = TrackWidth();
                    local nX = math.clamp(Mouse.X - SliderInner.AbsolutePosition.X, 0, Width);
                    local nValue = Slider:GetValueFromXOffset(nX);

                    if nValue ~= Slider.Value then
                        Slider:SetValue(nValue);
                    end;
                end;

                UpdateFromMouse();

                while InputService:IsMouseButtonPressed(Enum.UserInputType.MouseButton1) do
                    UpdateFromMouse();
                    RenderStepped:Wait();
                end;

                IsDragging = false;
                Slider:Display(false);
                Library:AttemptSave();
            end;
        end);

        SliderInner:GetPropertyChangedSignal('AbsoluteSize'):Connect(function()
            Slider:Display(true);
        end);

        Slider:Display(true);
        Groupbox:AddBlank(Info.BlankSize or 6);
        Groupbox:Resize();

        Options[Idx] = Slider;
        return Slider;
    end;
'''

          pattern = r"    function Funcs:AddSlider\(Idx, Info\).*?\n    end;\n\n    function Funcs:AddDropdown\(Idx, Info\)"
          replacement = slider_function + "\n    function Funcs:AddDropdown(Idx, Info)"
          source, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'slider function replacement count: {count}')

          required = [
              "local SliderRow = Library:Create('Frame'",
              "local ValueBadge = Library:Create('Frame'",
              "local function Nudge(Direction)",
              "Slider.Step = Slider.Rounding == 0 and 1 or (10 ^ -Slider.Rounding);",
              "Library:AddCorner(TextBoxOuter, 3);",
              "Library:AddCorner(ToggleOuter, 3);",
              "Library:AddCorner(DropdownOuter, 3);",
              "local WindowCornerRadius = UDim.new(0, 3);",
          ]
          for token in required:
              if token not in source:
                  raise SystemExit(f'missing expected token: {token}')

          path.write_text(source)
          PY

      - name: Commit slider polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Library.lua
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add slider value badge, nudge buttons, and rounded controls'
          git push origin HEAD:agent/slider-value-buttons-rounding

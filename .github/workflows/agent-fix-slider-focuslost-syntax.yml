name: Agent fix slider FocusLost syntax

on:
  push:
    branches:
      - agent/fix-slider-focuslost-syntax

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix malformed FocusLost callback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Library.lua')
          text = path.read_text()
          old = """        ValueEditor.FocusLost:Connect(function()\n            local TypedValue = tonumber(ValueEditor.Text);\n\n            if TypedValue then\n                Slider:SetValue(TypedValue);\n                Library:AttemptSave();\n            end;\n\n            ValueEditor.Visible = false;\n            ValueLabel.Visible = true;\n            ValueEditor.Text = tostring(Slider.Value);\n        end;\n"""
          new = old[:-6] + "end);\n"
          if old not in text:
              raise SystemExit('target FocusLost block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git config user.name "Fyntra-Development"
          git config user.email "129816818+Fyntra-Development@users.noreply.github.com"
          git add Library.lua
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix slider FocusLost callback syntax"
          git push
